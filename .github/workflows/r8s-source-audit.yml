name: Inspect r8s firmware inputs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8s-source-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          sparse-checkout: |
            scripts
            external
            security
            unica
            tests
            platform/exynos990
            target/r8s
      - name: Validate r8s integration before firmware preparation
        run: python3 -B -m unittest discover -s tests -v
      - name: Free unused runner storage
        run: |
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -n docker image prune --all --force
      - name: Install firmware inspection dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            attr bc binutils brotli build-essential clang cmake cpio curl ffmpeg file git lld lz4 patchelf \
            libbrotli-dev libbz2-dev libelf-dev libfuse-dev libgtest-dev liblz4-dev \
            libpcre2-dev libprotobuf-dev libssl-dev libunwind-dev libzstd-dev \
            pkg-config protobuf-compiler python-is-python3 \
            p7zip-full perl python3 rsync unzip webp wget xxd xz-utils zip zstd
          # Check the shared firmware helper's actual list before spending time on tools.
          python3 - <<'PY_CHECK'
          import pathlib, re, shlex, shutil
          source = pathlib.Path('scripts/utils/build_utils.sh').read_text()
          match = re.search(r'^DEPENDENCIES=\((.*?)^\)', source, re.M | re.S)
          if match is None: raise SystemExit('Shared dependency list not found')
          missing = [tool for tool in shlex.split(match[1]) if shutil.which(tool) is None]
          if missing: raise SystemExit('Missing host dependencies: ' + ' '.join(missing))
          PY_CHECK
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify pinned host tool sources
        id: tools-key
        run: echo "tree=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"
      - name: Restore host tools
        id: tools
        uses: actions/cache@v4
        with:
          path: out/tools
          key: r8s-host-tools-${{ runner.os }}-${{ steps.tools-key.outputs.tree }}
      - name: Build missing host tools
        run: |
          source ./buildenv.sh r8s
          ./scripts/build_dependencies.sh
      - name: Save host tools for the next ROM build
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/tools
          key: r8s-host-tools-${{ runner.os }}-${{ steps.tools-key.outputs.tree }}
      - name: Obtain the configured Samsung source and r8s firmware
        run: |
          source ./buildenv.sh r8s
          ./scripts/download_fw.sh
          ./scripts/extract_fw.sh
      - name: Collect exact framework and driver inputs
        run: |
          source ./buildenv.sh r8s
          mkdir -p out/r8s-inspection/source out/r8s-inspection/target
          for role in source target; do
            if [ "$role" = source ]; then firmware="$SOURCE_FIRMWARE"; else firmware="$TARGET_FIRMWARE"; fi
            IFS=/ read -r model csc _ <<< "$firmware"
            root="$FW_DIR/${model}_${csc}"
            cp "$root/.extracted" "out/r8s-inspection/$role/firmware-version.txt"
            for relative in system/system/build.prop system/system/etc/floating_feature.xml \
              system/system/etc/permissions system/system/etc/sysconfig system/system/etc/vintf \
              system/system/etc/init system/system/etc/ld.config.txt system/system/etc/public.libraries.txt \
              system/system/etc/task_profiles.json system/system/etc/cgroups.json \
              system/system/product/build.prop system/system/system_ext/build.prop \
              system/system/product/etc/task_profiles.json system/system/system_ext/etc/task_profiles.json \
              vendor/etc/task_profiles.json vendor/etc/cgroups.json vendor/etc/permissions vendor/etc/sensors \
              vendor/etc/gnss vendor/etc/gps.conf vendor/etc/camera vendor/etc/audio vendor/etc/usb \
              product/etc/build.prop product/build.prop system_ext/etc/build.prop system_ext/build.prop \
              odm/build.prop odm/etc/build.prop odm/etc/vintf odm/etc/init \
              vendor/build.prop vendor/etc/vintf vendor/etc/init vendor/etc/wifi vendor/etc/bluetooth \
              vendor/etc/selinux vendor/etc/fstab.exynos990 vendor/etc/audio_policy_configuration.xml; do
              if [ -e "$root/$relative" ]; then
                mkdir -p "out/r8s-inspection/$role/$(dirname "$relative")"
                cp -a "$root/$relative" "out/r8s-inspection/$role/$relative"
              fi
            done
            for relative in framework/services.jar framework/framework.jar framework/ssrm.jar framework/sdhms.jar \
              framework/framework-res.apk framework/telephony-common.jar framework/ims-common.jar \
              priv-app/TeleService/TeleService.apk priv-app/SecSettingsIntelligence/SecSettingsIntelligence.apk \
              app/NfcNci/NfcNci.apk priv-app/NfcNci/NfcNci.apk app/SecureElement/SecureElement.apk \
              priv-app/SecSettings/SecSettings.apk \
              priv-app/SettingsProvider/SettingsProvider.apk priv-app/BiometricSetting/BiometricSetting.apk \
              priv-app/SamsungDeviceHealthManagerService/SamsungDeviceHealthManagerService.apk \
              priv-app/SamsungCamera/SamsungCamera.apk system_ext/priv-app/SystemUI/SystemUI.apk \
              apex/com.android.bt.apex apex/com.android.btservices.apex; do
              if [ -f "$root/system/system/$relative" ]; then
                mkdir -p "out/r8s-inspection/$role/original/$(dirname "$relative")"
                cp "$root/system/system/$relative" "out/r8s-inspection/$role/original/$relative"
              fi
            done
            for relative in os_partitions_metadata.txt boot.img_metadata.txt dtbo.img_metadata.txt \
              fs_config-vendor file_context-vendor fs_config-system file_context-system; do
              if [ -f "$root/$relative" ]; then cp "$root/$relative" "out/r8s-inspection/$role/"; fi
            done
            for partition in vendor odm; do
              for folder in bin etc lib lib64; do
                [ -d "$root/$partition/$folder" ] || continue
                find "$root/$partition/$folder" -type f \
                  \( -iname '*sensor*' -o -iname '*fingerprint*' -o -iname '*gnss*' -o -iname '*gps*' \
                  -o -iname '*nfc*' -o -iname '*bluetooth*' -o -iname '*secril*' -o -name 'rild' \
                  -o -iname '*camera*provider*' -o -iname '*audio*' -o -iname '*wifi*' \
                  -o -iname '*supplicant*' -o -iname '*hostapd*' -o -iname '*power*' -o -iname '*usb*' \
                  -o -iname '*display*' -o -iname '*light*' -o -iname '*wfd*' \) -print0 | \
                while IFS= read -r -d '' file; do
                  relative="${file#"$root/"}"
                  mkdir -p "out/r8s-inspection/$role/drivers/$(dirname "$relative")"
                  cp "$file" "out/r8s-inspection/$role/drivers/$relative"
                done
              done
            done
            find "$root/vendor" -printf '%y %P -> %l\n' | LC_ALL=C sort > "out/r8s-inspection/$role/vendor-files.txt"
            find "$root/system" -printf '%y %P -> %l\n' | LC_ALL=C sort > "out/r8s-inspection/$role/system-files.txt"
            python3 - "$root" "out/r8s-inspection/$role/native-linkage.txt" <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          with open(sys.argv[2], 'w') as output:
              for folder in ('vendor/bin', 'vendor/lib', 'vendor/lib64', 'system/system/bin',
                             'system/system/lib', 'system/system/lib64', 'system/system/system_ext/lib64'):
                  for path in sorted((root / folder).rglob('*')):
                      if not path.is_file(): continue
                      with path.open('rb') as stream: magic = stream.read(4)
                      if magic != b'\x7fELF': continue
                      output.write('\nFILE ' + str(path.relative_to(root)) + '\n')
                      result = subprocess.run(['readelf', '-h', '-d', '--dyn-syms', '--wide', str(path)], capture_output=True, text=True)
                      for line in result.stdout.splitlines():
                          if any(key in line for key in ('Class:', 'Machine:', '(NEEDED)', '(SONAME)', ' GLOBAL ', ' WEAK ')):
                              output.write(line + '\n')
          PY
          done
          IFS=/ read -r model csc _ <<< "$SOURCE_FIRMWARE"
          root="$FW_DIR/${model}_${csc}/system/system"
          for relative in framework/services.jar framework/framework.jar \
            priv-app/SecSettings/SecSettings.apk priv-app/SettingsProvider/SettingsProvider.apk; do
            apktool -JXmx2500m d --no-res --no-debug-info -j 2 \
              -o "out/r8s-inspection/source/decoded/$relative" "$root/$relative"
          done
          cp "$TOOLS_DIR/bin/apktool.jar" out/r8s-inspection/
          find out/r8s-inspection/source/original out/r8s-inspection/target/original -type f -exec sha256sum {} + > out/r8s-inspection/input-sha256.txt
      - name: Retain exact source applications
        uses: actions/upload-artifact@v4
        with:
          name: r8s-source-applications
          path: out/r8s-inspection/source/original
          if-no-files-found: error
          retention-days: 5
      - name: Retain exact target applications
        uses: actions/upload-artifact@v4
        with:
          name: r8s-stock-applications
          path: out/r8s-inspection/target/original
          if-no-files-found: error
          retention-days: 5
      - name: Retain original HAL driver inputs
        uses: actions/upload-artifact@v4
        with:
          name: r8s-hardware-drivers
          path: |
            out/r8s-inspection/source/drivers
            out/r8s-inspection/target/drivers
          if-no-files-found: error
          retention-days: 5
      - name: Retain metadata and framework inspection
        uses: actions/upload-artifact@v4
        with:
          name: r8s-framework-and-hardware-metadata
          path: |
            out/r8s-inspection
            !out/r8s-inspection/source/original
            !out/r8s-inspection/target/original
            !out/r8s-inspection/source/drivers
            !out/r8s-inspection/target/drivers
          if-no-files-found: error
          retention-days: 5
