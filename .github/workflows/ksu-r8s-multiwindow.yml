name: Build MultiWindow KSU Fix (APK only)

on:
  push:
    branches:
      - ksu-r8s-multiwindow-fast-20261105
    paths:
      - '.github/workflows/ksu-r8s-multiwindow.yml'
      - 'tools/ksu-r8s-multiwindow/fast_build.sh'
  workflow_dispatch:

permissions:
  contents: read

# No shared concurrency group with older ROM workflow.
jobs:
  apk-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Checkout firmware tooling and source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Git for vendor adb patching
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(git config --global user.name)"
          test -n "$(git config --global user.email)"

      - name: Free unused runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Install prerequisites
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp build-essential \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget unzip zip
          sudo modprobe erofs || true
          sudo modprobe f2fs || true

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Rust for source firmware tool
        uses: dtolnay/rust-toolchain@stable

      - name: Restore ArtisanROM signing keys if configured
        env:
          PLATFORM_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
          OTA_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_PEM: ${{ secrets.OTA_KEY_PEM }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -n "$PLATFORM_PK8" ] && [ -n "$PLATFORM_PEM" ] && \
             [ -n "$OTA_PK8" ] && [ -n "$OTA_PEM" ]; then
            printf %s "$PLATFORM_PK8" | base64 -d > security/artisanrom_platform.pk8
            printf %s "$PLATFORM_PEM" | base64 -d > security/artisanrom_platform.x509.pem
            printf %s "$OTA_PK8" | base64 -d > security/artisanrom_ota.pk8
            printf %s "$OTA_PEM" | base64 -d > security/artisanrom_ota.x509.pem
            echo "Using repository-configured ArtisanROM signing keys."
          else
            echo "No complete ArtisanROM key set; AOSP development keys will be used."
          fi

      - name: Build only source-firmware SDHMS APK (no ROM/kernel)
        shell: bash
        run: |
          set -eo pipefail
          bash tools/ksu-r8s-multiwindow/fast_build.sh

      - name: Upload validated experimental KSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM-r8s-MultiWindow-KSU-FAST-TEST
          path: dist/
          if-no-files-found: error
          retention-days: 14
