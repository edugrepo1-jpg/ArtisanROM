name: Build r8s port

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8s-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      UNICA_BROTLI_QUALITY: '1'
    steps:
      - name: Checkout r8s source
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Validate source integration
        run: python3 -m unittest discover -s tests -v
      - name: Free runner disk
        run: |
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -n docker image prune --all --force
          sudo -n docker builder prune --all --force
      - name: Free unused toolchains
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - name: Slim build runner
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: compiler_cmake
      - name: Install build dependencies
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            attr bc bison brotli build-essential ccache clang cpio curl flex \
            f2fs-tools ffmpeg g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git jq kmod \
            libbrotli-dev libbz2-dev libelf-dev libfuse-dev libgtest-dev \
            liblz4-dev libpcre2-dev libprotobuf-dev libssl-dev libunwind-dev \
            libzstd-dev lld lz4 patchelf \
            protobuf-compiler python-is-python3 python3 rsync unzip webp wget xz-utils zip
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Upstream supports unofficial signing with its bundled AOSP keys.
          # Do not create empty official keys from absent upstream secrets.
      - name: Verify host F2FS support before firmware downloads
        run: bash scripts/internal/prepare_ci_filesystems.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Identify pinned host tool sources
        id: tools-key
        run: echo "tree=$(git rev-parse HEAD:external)" >> "$GITHUB_OUTPUT"
      - name: Restore inspected host tools
        uses: actions/cache@v4
        with:
          path: out/tools
          key: r8s-host-tools-${{ runner.os }}-${{ steps.tools-key.outputs.tree }}
      - name: Build host tools
        run: |
          source ./buildenv.sh r8s
          ./scripts/build_dependencies.sh
      - name: Download source and target firmware
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh r8s && ./scripts/download_fw.sh
      - name: Extract firmware
        run: |
          source ./buildenv.sh r8s
          ./scripts/extract_fw.sh
      - name: Add swap for kernel and APK builds
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12
      - name: Build unofficial r8s ROM
        run: |
          set -o pipefail
          source ./buildenv.sh r8s
          ./scripts/make_rom.sh --beta 2>&1 | tee out/r8s-build.log
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8s-build-diagnostics
          path: |
            out/r8s-build.log
            out/config.sh
            out/target/r8s/*.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Retain failed patch inputs for offline correction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8s-patch-context
          path: |
            out/target/r8s/apktool/system/framework/services.jar
            out/target/r8s/apktool/system/framework/framework.jar
            out/target/r8s/apktool/system/priv-app/SecSettings/SecSettings.apk
          if-no-files-found: ignore
          retention-days: 5
      - name: Retain ROM for device validation
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM-r8s-unofficial-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
