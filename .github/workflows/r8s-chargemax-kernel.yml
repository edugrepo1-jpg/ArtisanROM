name: Build r8s ChargeMax kernel only

on:
  workflow_dispatch:
  push:
    branches:
      - r8s-chargemax-thermal-current-20261031
    paths:
      - '.github/workflows/r8s-chargemax-kernel.yml'
      - 'scripts/internal/build_r8s_chargemax_kernel.sh'
      - 'tests/test_r8s_charging_policy.py'
      - 'platform/exynos990/patches/artisankrnl/customize.sh'

permissions:
  contents: read

concurrency:
  group: r8s-chargemax-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout port source
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /scripts/internal/build_r8s_chargemax_kernel.sh
            /scripts/internal/check_r8s_boot_tables.py
            /tests/test_r8s_charging_policy.py
            /platform/exynos990/patches/artisankrnl/
      - name: Validate stored patch bytes before downloading the kernel
        run: python3 -B -m unittest discover -s tests -p test_r8s_charging_policy.py -v
      - name: Install kernel prerequisites
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev libssl-dev \
            lld python3 rsync unzip xz-utils zip
      - name: Add temporary build swap
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8
      - name: Build pinned r8s kernel directly from kernel fork
        run: bash scripts/internal/build_r8s_chargemax_kernel.sh
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8s-chargemax-kernel-diagnostics-${{ github.run_id }}
          path: out/chargemax-build.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Retain kernel for matched-boot packaging
        uses: actions/upload-artifact@v4
        with:
          name: r8s-chargemax-kernel-${{ github.sha }}
          path: out/chargemax-artifacts/
          if-no-files-found: error
          compression-level: 1
          retention-days: 5
