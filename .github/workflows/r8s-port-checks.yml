name: r8s port checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'target/r8s/**'
      - 'platform/exynos990/patches/artisankrnl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'unica/patches/camera/**'
      - 'unica/patches/__floating_feature/**'
      - 'unica/patches/cidmanager/**'
      - 'unica/patches/bluetooth/**'
      - 'unica/patches/product_feature/audio/virtual_vib/**'
      - 'unica/mods/csc/**'
      - 'unica/mods/settings/**'
      - '.github/workflows/r8s-port-checks.yml'

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check r8s source integration
        run: python3 -B -m unittest discover -s tests -v
      - name: Check Bash syntax
        run: |
          bash -n platform/exynos990/patches/artisankrnl/customize.sh
          find target/r8s -name '*.sh' -type f -exec bash -n {} \;
